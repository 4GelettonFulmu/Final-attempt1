<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Halftone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            position: fixed;
        }

        #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #videoElement {
            display: none;
        }

        #debugCanvas {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="mainCanvas"></canvas>
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="debugCanvas"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <script>
        // Configuration
        const CONFIG = {
            dotSize: 14,
            dotSpacing: 12,
            maxLayers: 10,
            layerOpacity: 0.5,
            colors: ['#FF3333', '#3399FF', '#FF33FF', '#33FF33'], // Bright colors for black background
            gestureCooldown: 1000, // milliseconds between gesture triggers
            handClosedThreshold: 0.1, // Distance threshold for fist detection
            bottomZoneHeight: 0.25, // Bottom 25% of screen
            contrastBoost: 2.0, // Greatly exaggerate brightness differences
            // Physics parameters - Tuned for subtle micro-fluctuations
            springStiffness: 0.12, // Even higher stiffness - dots very tightly anchored (was 0.09)
            damping: 0.95, // Very high damping - instant snap back (was 0.94)
            repulsionRadius: 50, // Smaller radius for very localized effect (was 60)
            repulsionStrength: 2.5, // Very weak push - max 10px displacement (was 3.5)
            motionThreshold: 15, // Minimum pixel difference to detect motion
            ambientIntensity: 1.0, // Minimal breathing - ~1px movement (was 1.2)
            ambientSpeed: 0.0015, // Speed of ambient animation
            colorTransitionSpeed: 0.05 // Speed of color gradient transitions
        };

        // Global variables
        let video, mainCanvas, mainCtx, debugCanvas, debugCtx;
        let hands, camera;
        let isInitialized = false;
        let currentColorIndex = 0;
        let targetColorIndex = 0; // For smooth color transitions
        let colorTransition = 0; // 0 to 1 transition progress
        let layers = [];
        let lastGestureTime = 0;
        let handPosition = { x: 0, y: 0 };
        let showHandIndicator = false;

        // Liquid physics grid
        let liveDots = [];
        let previousFrameData = null;
        let time = 0;

        // LiveDot class - Physics-enabled dots for live layer
        class LiveDot {
            constructor(gridX, gridY, originX, originY) {
                this.gridX = gridX;
                this.gridY = gridY;
                this.originX = originX;
                this.originY = originY;
                this.currentX = originX;
                this.currentY = originY;
                this.velocityX = 0;
                this.velocityY = 0;
                this.brightness = 0;
                this.isFigure = false; // Is this dot part of a figure or background?
            }

            // Spring-Damper physics update
            update(deltaTime = 1) {
                // Spring force pulling dot back to origin
                const springForceX = (this.originX - this.currentX) * CONFIG.springStiffness;
                const springForceY = (this.originY - this.currentY) * CONFIG.springStiffness;

                // Apply forces to velocity
                this.velocityX += springForceX;
                this.velocityY += springForceY;

                // Apply damping (friction)
                this.velocityX *= CONFIG.damping;
                this.velocityY *= CONFIG.damping;

                // Update position
                this.currentX += this.velocityX * deltaTime;
                this.currentY += this.velocityY * deltaTime;

                // Ambient motion for background dots
                if (!this.isFigure) {
                    const waveX = Math.sin(time * CONFIG.ambientSpeed + this.gridX * 0.1) * CONFIG.ambientIntensity;
                    const waveY = Math.cos(time * CONFIG.ambientSpeed + this.gridY * 0.15) * CONFIG.ambientIntensity;
                    this.currentX += waveX * 0.3;
                    this.currentY += waveY * 0.3;
                }
            }

            // Apply repulsion force from motion point
            applyRepulsion(motionX, motionY, intensity = 1) {
                const dx = this.currentX - motionX;
                const dy = this.currentY - motionY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < CONFIG.repulsionRadius && distance > 0) {
                    // Repulsion force falls off with distance
                    const force = (1 - distance / CONFIG.repulsionRadius) * CONFIG.repulsionStrength * intensity;
                    const angle = Math.atan2(dy, dx);

                    this.velocityX += Math.cos(angle) * force;
                    this.velocityY += Math.sin(angle) * force;
                }
            }

            // Get radius based on brightness
            getRadius() {
                return (CONFIG.dotSize / 2) * this.brightness;
            }
        }

        // Layer class (for frozen snapshots - these remain static)
        class HalftoneLayer {
            constructor(imageData, color, width, height) {
                this.imageData = imageData;
                this.color = color;
                this.width = width;
                this.height = height;
                this.dots = this.generateDots();
            }

            generateDots() {
                const dots = [];
                const cols = Math.floor(this.width / CONFIG.dotSpacing);
                const rows = Math.floor(this.height / CONFIG.dotSpacing);

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const pixelX = Math.floor(x * CONFIG.dotSpacing);
                        const pixelY = Math.floor(y * CONFIG.dotSpacing);
                        const brightness = this.getBrightness(pixelX, pixelY);

                        if (brightness > 0.08) {
                            // Scale dot size - darker areas get larger dots
                            const radius = (CONFIG.dotSize / 2) * brightness;
                            dots.push({
                                x: pixelX,
                                y: pixelY,
                                radius: radius
                            });
                        }
                    }
                }
                return dots;
            }

            getBrightness(x, y) {
                const index = (y * this.width + x) * 4;
                const r = this.imageData.data[index];
                const g = this.imageData.data[index + 1];
                const b = this.imageData.data[index + 2];
                const avg = (r + g + b) / 3;
                let brightness = 1 - (avg / 255); // Invert for halftone effect

                // Apply strong contrast boost - greatly exaggerate differences
                brightness = Math.pow(brightness, 1 / CONFIG.contrastBoost);

                // Add minimum brightness boost for figures
                if (brightness > 0.15) {
                    brightness = 0.15 + (brightness - 0.15) * 1.3;
                }

                return Math.min(1, Math.max(0, brightness));
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = CONFIG.layerOpacity;
                ctx.fillStyle = this.color;

                this.dots.forEach(dot => {
                    ctx.beginPath();
                    ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.restore();
            }
        }

        // Initialize webcam
        async function initWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                });
                video.srcObject = stream;

                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve(true);
                    };
                });
            } catch (err) {
                console.error('Error accessing webcam:', err);
                return false;
            }
        }

        // Initialize MediaPipe Hands
        function initMediaPipe() {
            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            hands.onResults(onHandsResults);

            camera = new Camera(video, {
                onFrame: async () => {
                    await hands.send({ image: video });
                },
                width: 1280,
                height: 720
            });

            camera.start();
        }

        // Process hand tracking results
        function onHandsResults(results) {
            if (!isInitialized) return;

            // Draw current webcam frame with halftone effect
            drawLiveHalftone();

            // Draw all frozen layers
            layers.forEach(layer => layer.draw(mainCtx));

            // Process hand gestures
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                showHandIndicator = true;

                // Get palm position for tracking
                const wrist = hand[0];
                handPosition.x = wrist.x * mainCanvas.width;
                handPosition.y = wrist.y * mainCanvas.height;

                processGesture(hand);

                // Draw hand indicator
                drawHandIndicator();
            } else {
                showHandIndicator = false;
            }
        }

        // Draw live halftone effect
        // Initialize live dots grid
        function initLiveDots() {
            liveDots = [];
            const cols = Math.floor(mainCanvas.width / CONFIG.dotSpacing);
            const rows = Math.floor(mainCanvas.height / CONFIG.dotSpacing);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const originX = x * CONFIG.dotSpacing + CONFIG.dotSpacing / 2;
                    const originY = y * CONFIG.dotSpacing + CONFIG.dotSpacing / 2;
                    liveDots.push(new LiveDot(x, y, originX, originY));
                }
            }
        }

        // Detect motion between frames
        function detectMotion(currentFrameData, previousFrameData) {
            if (!previousFrameData) return [];

            const motionPoints = [];
            const downscale = 8; // Check every 8th pixel for performance
            const width = debugCanvas.width;
            const height = debugCanvas.height;

            for (let y = 0; y < height; y += downscale) {
                for (let x = 0; x < width; x += downscale) {
                    const index = (y * width + x) * 4;

                    const r1 = currentFrameData[index];
                    const g1 = currentFrameData[index + 1];
                    const b1 = currentFrameData[index + 2];

                    const r2 = previousFrameData[index];
                    const g2 = previousFrameData[index + 1];
                    const b2 = previousFrameData[index + 2];

                    const diff = Math.abs(r1 - r2) + Math.abs(g1 - g2) + Math.abs(b1 - b2);

                    if (diff > CONFIG.motionThreshold) {
                        // Scale to main canvas coordinates
                        const canvasX = (x / width) * mainCanvas.width;
                        const canvasY = (y / height) * mainCanvas.height;
                        const intensity = Math.min(diff / 100, 1);
                        motionPoints.push({ x: canvasX, y: canvasY, intensity });
                    }
                }
            }

            return motionPoints;
        }

        // Liquid physics halftone rendering
        function drawLiveHalftone() {
            // Increment time for ambient motion
            time++;

            // Clear canvas with black background
            mainCtx.fillStyle = '#000';
            mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

            // Draw video to debug canvas
            debugCtx.drawImage(video, 0, 0, debugCanvas.width, debugCanvas.height);
            const imageData = debugCtx.getImageData(0, 0, debugCanvas.width, debugCanvas.height);

            // Detect motion
            const motionPoints = detectMotion(imageData.data, previousFrameData);
            previousFrameData = new Uint8Array(imageData.data);

            // Update color transition for gradient effect
            if (targetColorIndex !== currentColorIndex) {
                colorTransition += CONFIG.colorTransitionSpeed;
                if (colorTransition >= 1) {
                    colorTransition = 0;
                    currentColorIndex = targetColorIndex;
                }
            }

            // Interpolate between current and target color
            const currentColor = hexToRgb(CONFIG.colors[currentColorIndex]);
            const targetColor = hexToRgb(CONFIG.colors[targetColorIndex]);
            const r = Math.round(currentColor.r + (targetColor.r - currentColor.r) * colorTransition);
            const g = Math.round(currentColor.g + (targetColor.g - currentColor.g) * colorTransition);
            const b = Math.round(currentColor.b + (targetColor.b - currentColor.b) * colorTransition);
            const interpolatedColor = `rgb(${r}, ${g}, ${b})`;

            // Update and render dots
            mainCtx.globalAlpha = CONFIG.layerOpacity;
            mainCtx.fillStyle = interpolatedColor;

            liveDots.forEach(dot => {
                // Get brightness for this dot
                const videoX = Math.floor((dot.originX / mainCanvas.width) * debugCanvas.width);
                const videoY = Math.floor((dot.originY / mainCanvas.height) * debugCanvas.height);
                const brightness = getBrightnessFromImageData(imageData, videoX, videoY, debugCanvas.width);

                dot.brightness = brightness;
                dot.isFigure = brightness > 0.15;

                // Apply repulsion from motion points
                motionPoints.forEach(motion => {
                    dot.applyRepulsion(motion.x, motion.y, motion.intensity);
                });

                // Update physics
                dot.update();

                // Draw dot at physics-computed position
                if (brightness > 0.08) {
                    const radius = dot.getRadius();
                    mainCtx.beginPath();
                    mainCtx.arc(dot.currentX, dot.currentY, radius, 0, Math.PI * 2);
                    mainCtx.fill();
                }
            });

            mainCtx.globalAlpha = 1.0;
        }

        // Helper function to convert hex to RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 255, b: 255 };
        }

        // Get brightness from image data
        function getBrightnessFromImageData(imageData, x, y, width) {
            const index = (y * width + x) * 4;
            const r = imageData.data[index] || 0;
            const g = imageData.data[index + 1] || 0;
            const b = imageData.data[index + 2] || 0;
            const avg = (r + g + b) / 3;
            let brightness = 1 - (avg / 255);

            // Apply strong contrast boost - greatly exaggerate differences
            brightness = Math.pow(brightness, 1 / CONFIG.contrastBoost);

            // Add minimum brightness boost for figures
            if (brightness > 0.15) {
                brightness = 0.15 + (brightness - 0.15) * 1.3;
            }

            return Math.min(1, Math.max(0, brightness));
        }

        // Draw hand indicator
        function drawHandIndicator() {
            if (!showHandIndicator) return;

            // Draw subtle circle at hand position
            mainCtx.save();
            mainCtx.globalAlpha = 0.3;
            mainCtx.strokeStyle = CONFIG.colors[currentColorIndex];
            mainCtx.lineWidth = 3;
            mainCtx.beginPath();
            mainCtx.arc(handPosition.x, handPosition.y, 30, 0, Math.PI * 2);
            mainCtx.stroke();
            mainCtx.restore();
        }

        // Process hand gesture - using simple finger counting
        function processGesture(hand) {
            // Check cooldown
            const now = Date.now();
            if (now - lastGestureTime < CONFIG.gestureCooldown) {
                return;
            }

            // Detect if hand is closed (fist) or open
            const isHandClosed = detectFist(hand);
            const isHandOpen = detectOpenHand(hand);

            // Check if hand is in bottom zone
            const isBottomZone = handPosition.y > mainCanvas.height * (1 - CONFIG.bottomZoneHeight);

            if (isHandClosed) {
                // Closed fist = Replace all layers with new freeze frame
                layers = [];
                freezeFrame();
                lastGestureTime = now;
                flashFeedback('#00FF00'); // Green flash
            } else if (isHandOpen) {
                // Open hand = Replace all layers with new freeze frame
                layers = [];
                freezeFrame();
                lastGestureTime = now;
                flashFeedback('#FFFF00'); // Yellow flash
            }
        }

        // Detect closed fist
        function detectFist(hand) {
            // Check if all fingertips are close to palm
            const palm = hand[0]; // Wrist
            const fingertips = [4, 8, 12, 16, 20]; // Thumb, Index, Middle, Ring, Pinky tips

            let closedCount = 0;
            for (let tip of fingertips) {
                const dx = hand[tip].x - palm.x;
                const dy = hand[tip].y - palm.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < CONFIG.handClosedThreshold) {
                    closedCount++;
                }
            }

            return closedCount >= 4; // At least 4 fingers closed
        }

        // Detect open hand
        function detectOpenHand(hand) {
            // Check if all fingertips are far from palm
            const palm = hand[0]; // Wrist
            const fingertips = [4, 8, 12, 16, 20]; // Thumb, Index, Middle, Ring, Pinky tips

            let extendedCount = 0;
            for (let tip of fingertips) {
                const dx = hand[tip].x - palm.x;
                const dy = hand[tip].y - palm.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > CONFIG.handClosedThreshold + 0.05) {
                    extendedCount++;
                }
            }

            return extendedCount >= 4; // At least 4 fingers extended
        }

        // Flash feedback when gesture is detected
        // Flash feedback disabled - color transitions handled by gradient system
        function flashFeedback(color) {
            // No-op: Color changes now use smooth gradient transitions
        }

        // Freeze current frame as a layer
        function freezeFrame() {
            // Check layer limit
            if (layers.length >= CONFIG.maxLayers) {
                layers.shift(); // Remove oldest layer
            }

            // Capture current frame
            debugCtx.drawImage(video, 0, 0, debugCanvas.width, debugCanvas.height);
            const imageData = debugCtx.getImageData(0, 0, debugCanvas.width, debugCanvas.height);

            // Create new layer with current color (use actual current, not target)
            const color = CONFIG.colors[currentColorIndex];
            const layer = new HalftoneLayer(imageData, color, debugCanvas.width, debugCanvas.height);

            // Scale dots to match main canvas
            const scaleX = mainCanvas.width / debugCanvas.width;
            const scaleY = mainCanvas.height / debugCanvas.height;
            layer.dots.forEach(dot => {
                dot.x *= scaleX;
                dot.y *= scaleY;
            });

            layers.push(layer);

            // Initiate gradient transition to next color
            targetColorIndex = (currentColorIndex + 1) % CONFIG.colors.length;
            colorTransition = 0;
        }

        // Clear all layers (keyboard shortcut)
        function clearLayers() {
            layers = [];
            currentColorIndex = 0;
            targetColorIndex = 0;
            colorTransition = 0;
        }

        // Initialize canvas
        function initCanvas() {
            mainCanvas.width = window.innerWidth;
            mainCanvas.height = window.innerHeight;

            debugCanvas.width = video.videoWidth;
            debugCanvas.height = video.videoHeight;

            // Initialize liquid physics grid
            initLiveDots();
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (isInitialized) {
                initCanvas();
            }
        });

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R' || e.key === 'c' || e.key === 'C') {
                clearLayers();
            }
        });

        // Initialize application
        async function init() {
            video = document.getElementById('videoElement');
            mainCanvas = document.getElementById('mainCanvas');
            mainCtx = mainCanvas.getContext('2d');
            debugCanvas = document.getElementById('debugCanvas');
            debugCtx = debugCanvas.getContext('2d');

            const webcamReady = await initWebcam();
            if (!webcamReady) {
                console.error('Failed to initialize webcam');
                return;
            }

            // Wait for video metadata
            await new Promise(resolve => setTimeout(resolve, 500));

            initCanvas();
            initMediaPipe();

            isInitialized = true;

            // Request fullscreen
            document.documentElement.requestFullscreen().catch(err => {
                console.log('Fullscreen request failed:', err);
            });
        }

        // Start on page load
        window.addEventListener('load', init);

        // Handle fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement && isInitialized) {
                initCanvas();
            }
        });
    </script>
</body>
</html>
